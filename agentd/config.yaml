run_concurrency: 1
automation:
  provider: codex
review:
  task_timeout: 10m
  retention: 168h
  model_concurrency: 4
notify:
  banner: decisions
repositories:
  - repo: grafana/loki
    policies:
      merge-dependency-updates:
        shadow: false
        allowed_authors: ["app/renovate-sh-app"]
        allowed_paths:
          - "**/go.mod"
          - "**/go.sum"
          - "vendor/**"
          - "**/Dockerfile"
          - "**/*.Dockerfile"
          - "**/*.dockerfile"
      approve-auto-dismissed:
        exclude_paths: ["docs/**", "**/*.md"]
        min_confidence: 0.8
  - repo: trevorwhitney/agentd-acceptance
    allow_operator_prs: true
    policies:
      consult-triage:
        verdicts:
          approve:
            action: none
          needs-human:
            action: none

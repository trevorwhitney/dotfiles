poll_interval: 2m
notify:
  banner: decisions
repositories:
  - repo: grafana/loki
    policies:
      merge-dependency-updates:
        shadow: false
        allowed_authors: ["app/renovate-sh-app"]
        allowed_paths:
          - "**/go.mod"
          - "**/go.sum"
          - "vendor/**"
          - "**/Dockerfile"
          - "**/*.Dockerfile"
          - "**/*.dockerfile"
